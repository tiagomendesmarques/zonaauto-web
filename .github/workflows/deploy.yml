# Publica o site no Cloud Run sempre que há alterações no ramo main.
# As variáveis do repositório (GCP_*) são criadas pelo ./deploy.sh.
name: Publicar no Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Mantém as variáveis de ambiente e as definições já existentes do serviço
      - name: Deploy
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --source . \
            --quiet

      - name: Verificar
        run: |
          URL=$(gcloud run services describe "${{ vars.GCP_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          curl -fsS "$URL/healthz"
